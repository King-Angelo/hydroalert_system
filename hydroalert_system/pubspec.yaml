name: hydroalert_workspace
publish_to: none

environment:
  sdk: '^3.11.0' # This fulfills the requirement and enables workspaces

workspace:
  - apps/admin_app
  - apps/resident_app
  - apps/official_app
  # backend/api is excluded: Dart Frog + firebase_admin deps conflict with Flutter workspace (intl, etc.)
  # List shared_models only — do not use packages/* (vendored dart_firebase_admin_plus for the API
  # uses intl ^0.19 and must not participate in the Flutter workspace).
  - packages/shared_models